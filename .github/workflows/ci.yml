name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint & type check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # only 3.14: it's the Lambda's actual runtime (see Makefile) and the
        # only one requires-python allows in pyproject.toml.
        python-version: ['3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install $(python -c "import tomllib; project = tomllib.load(open('pyproject.toml', 'rb'))['project']; print('\n'.join(project['dependencies'] + project['optional-dependencies']['dev']))")

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run Ruff (format)
        run: ruff format --check .

      - name: Run mypy
        run: mypy
